name: CI

# Tests for the reviewer itself. (review.yml is the reusable workflow that
# other repos call; this one only runs on changes to this repo.)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh

      - name: Config is valid JSON
        run: jq empty review-config.json opencode.json
