name: AI Review

on:
  workflow_call:
    inputs:
      reviewer_ref:
        description: >
          Ref of ai-code-reviewer whose scripts/prompt to run. Set this to the
          same tag you put after @ in `uses:` (e.g. v1) so the workflow file
          and the scripts can't drift apart.
        type: string
        required: false
        default: main
      opencode_version:
        description: Exact opencode-ai npm version to install (pinned for reproducible reviews).
        type: string
        required: false
        default: "1.18.31"
      model_timeout:
        description: Seconds before a model call is abandoned.
        type: number
        required: false
        default: 600
      coverage_artifact:
        description: Name of an artifact from this workflow run containing a coverage report (optional).
        type: string
        required: false
        default: ""
      coverage_path:
        description: Path of the coverage report inside that artifact (Cobertura XML, JaCoCo XML or LCOV).
        type: string
        required: false
        default: coverage.xml
      scanners:
        description: Run the deterministic scanners (gitleaks, osv-scanner, opengrep, trivy, zizmor, actionlint).
        type: boolean
        required: false
        default: true
    secrets:
      LLM_API_KEY:
        description: Provider API key. Without it every reviewer runs on the free-tier model and the bot never approves.
        required: false

permissions: {}

jobs:
  scan:
    name: Scanners
    if: ${{ inputs.scanners }}
    runs-on: ubuntu-latest
    concurrency:
      group: ai-scan-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout target repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Checkout ai-code-reviewer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: radeshgovind-2005/ai-code-reviewer
          ref: ${{ inputs.reviewer_ref }}
          path: reviewer
          persist-credentials: false

      - name: Install scanners (pinned, checksum-verified)
        run: |
          bash "$GITHUB_WORKSPACE/reviewer/scripts/install-scanners.sh" "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run scanners
        id: scan
        working-directory: target
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER_HOME: ${{ github.workspace }}/reviewer
          OUT_DIR: ${{ runner.temp }}/scan
        run: bash "$REVIEWER_HOME/scripts/run-scanners.sh"

      - name: Upload scanner findings
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scanner-findings
          path: |
            ${{ runner.temp }}/scan/scanner-findings.json
            ${{ runner.temp }}/scan/scanner-findings.sarif
            ${{ runner.temp }}/scan/scanner-summary.md
          if-no-files-found: ignore
          retention-days: 14

  review:
    name: AI Review
    needs: scan
    # Run even if the scanners found blocking issues, failed, or were disabled:
    # the scan job's own red status is what blocks; the review adds context.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # A newer push supersedes an in-flight review of the same PR.
    concurrency:
      group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Checkout ai-code-reviewer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: radeshgovind-2005/ai-code-reviewer
          ref: ${{ inputs.reviewer_ref }}
          path: reviewer
          persist-credentials: false

      - name: Download scanner findings
        if: ${{ inputs.scanners }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scanner-findings
          path: ${{ runner.temp }}/scan

      - name: Download coverage report
        if: ${{ inputs.coverage_artifact != '' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.coverage_artifact }}
          path: ${{ runner.temp }}/coverage

      - name: Install OpenCode (pinned)
        env:
          OPENCODE_VERSION: ${{ inputs.opencode_version }}
        run: |
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          opencode --version

      - name: Run review
        working-directory: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER_HOME: ${{ github.workspace }}/reviewer
          MODEL_TIMEOUT: ${{ inputs.model_timeout }}
          SCANNER_FINDINGS: ${{ runner.temp }}/scan/scanner-findings.json
          COVERAGE_REPORT: ${{ inputs.coverage_artifact != '' && format('{0}/coverage/{1}', runner.temp, inputs.coverage_path) || '' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REVIEW_ARTIFACTS_DIR: ${{ runner.temp }}/review-artifacts
          AI_REVIEW_MARKER: ${{ runner.temp }}/ai-review-reported
        run: bash "$REVIEWER_HOME/scripts/run-review.sh"

      - name: Upload review artifacts (prompts, per-reviewer metrics)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-review
          path: ${{ runner.temp }}/review-artifacts
          if-no-files-found: ignore
          retention-days: 14

      # Fail closed even when the job dies before/around run-review.sh (checkout
      # or install failed, script killed). Skipped if the script already
      # posted its own review or failure review.
      - name: Report review did not complete
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: ${{ runner.temp }}/ai-review-reported
        run: |
          if [ -f "$MARKER" ]; then
            echo "run-review.sh already reported; nothing to do."
            exit 0
          fi
          # Don't leave an older bot approval standing on the new commits.
          for id in $(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id'); do
            gh api --method PUT "repos/${REPO}/pulls/${PR_NUMBER}/reviews/${id}/dismissals" \
              -f message="AI review of ${HEAD_SHA:0:7} did not complete." > /dev/null || true
          done
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --method POST \
            -f commit_id="${HEAD_SHA}" -f event=COMMENT \
            -f body="### ⚠️ AI review did not complete

          The review job failed before a review could be posted (setup step or script crash). This PR has **not** been reviewed by the AI reviewer. See the [workflow run](${RUN_URL}) for details, then re-run the job."
