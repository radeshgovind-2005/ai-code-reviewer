name: AI Review

on:
  workflow_call:
    inputs:
      reviewer_ref:
        description: >
          Ref of ai-code-reviewer whose scripts/prompt to run. Set this to the
          same tag you put after @ in `uses:` (e.g. v1) so the workflow file
          and the scripts can't drift apart.
        type: string
        required: false
        default: main
      model_timeout:
        description: Seconds before the model call is abandoned.
        type: number
        required: false
        default: 600
    secrets:
      LLM_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Checkout ai-code-reviewer
        uses: actions/checkout@v4
        with:
          repository: radeshgovind-2005/ai-code-reviewer
          ref: ${{ inputs.reviewer_ref }}
          path: reviewer

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Run review
        working-directory: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER_HOME: ${{ github.workspace }}/reviewer
          MODEL_TIMEOUT: ${{ inputs.model_timeout }}
        run: |
          chmod +x "$REVIEWER_HOME/scripts/run-review.sh"
          "$REVIEWER_HOME/scripts/run-review.sh"
